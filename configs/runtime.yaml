# Source presentation-time policy. These are engineering defaults, not learned durations.
event_threshold: 0.60
recipient_threshold: 0.60
region_threshold: 0.55
observable_threshold: 0.65
confirm_samples: 2
release_ms: 250
# Cooldown starts after sustained negatives release the previous episode.
cooldown_ms: 350
duration_ms: 220
smoothing_alpha: 0.5
# Seek backwards or a larger forward jump clears confirmation and cooldown.
max_gap_ms: 750
