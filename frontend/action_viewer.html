<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>UHM · Action timeline</title>
<style>
:root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #091321; color: #eaf4f7 }
* { box-sizing: border-box } body { margin: 0; } main { max-width: 1100px; margin: auto; padding: 28px 22px 60px }
header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 22px }
h1 { font-size: clamp(28px, 4vw, 42px); margin: 4px 0; letter-spacing: -.04em } h2 { font-size: 18px; margin: 0 0 16px }
.eyebrow { font-size: 11px; color: #6fe0c2; letter-spacing: .17em; font-weight: 700 }
.subtle, .meta { color: #9db1c2; font-size: 13px } .meta { text-align: right }
video { display: block; width: 100%; max-height: 58vh; border-radius: 10px; background: #03070b }
.panel { margin-top: 20px; background: #102235; border: 1px solid #2a4559; border-radius: 14px; padding: 22px }
.banner { border-left: 4px solid #eead6c; background: #3a2b2e; padding: 12px 16px; margin: 0 0 18px; font-weight: 650 }
.row { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 16px; margin: 12px 0 }
.name { text-transform: capitalize; font-size: 13px; color: #cddbe7 } .track { height: 20px; background: #253d50; border-radius: 8px; position: relative; overflow: hidden }
.unknown { position: absolute; height: 100%; background: repeating-linear-gradient(45deg, #846c62 0 5px, #554b52 5px 10px) }
.segment { position: absolute; top: 1px; bottom: 1px; padding: 0; background: #66d4b5; border: 0; border-radius: 5px; cursor: pointer; min-width: 3px }
.segment:focus-visible, .jump:focus-visible { outline: 2px solid white; outline-offset: 2px }
.playhead { position: absolute; z-index: 3; height: 100%; width: 2px; background: white; pointer-events: none }
.axis { display: flex; justify-content: space-between; margin-left: 126px; color: #8ea8ba; font-size: 11px }
.legend { display: flex; gap: 20px; flex-wrap: wrap; color: #9db1c2; font-size: 12px; margin-top: 20px }
.swatch { display: inline-block; width: 14px; height: 9px; margin-right: 5px; background: #66d4b5 } .swatch.uncertain { background: #846c62 }
#details { max-height: 180px; overflow: auto; margin-top: 16px; padding-left: 20px; color: #b7c7d3; font-size: 12px }
.jump { color: #70dbc0; background: none; border: none; cursor: pointer; padding: 4px }
</style></head><body><main>
<header><div><div class="eyebrow">UNIVERSAL HAPTIC MODEL / VIDEO ACTIONS</div><h1>Action timeline</h1><div id="source" class="subtle">Loading source…</div></div><div class="meta">Offline video inspection<br>Action labels and timestamps only</div></header>
<video id="video" src="/api/video" controls muted playsinline preload="metadata"></video>
<section class="panel" aria-labelledby="timeline-title"><div id="banner" class="banner" hidden></div><h2 id="timeline-title">Visible actions</h2><p id="notes" class="subtle"></p><div id="rows"></div><div class="axis"><span>0s</span><span id="duration"></span></div><div class="legend"><span><i class="swatch"></i>Label above threshold</span><span><i class="swatch uncertain"></i>Unknown / not run</span><span>White line: playback position</span></div><p id="summary" class="subtle"></p><details><summary>Window status</summary><ul id="details"></ul></details></section>
</main><script>
const video = document.getElementById('video');
const fmt = value => `${Number(value).toFixed(2)}s`;
const percent = (value, duration) => `${Math.max(0, Math.min(100, value / duration * 100))}%`;
Promise.all([fetch('/api/meta').then(r => r.json()), fetch('/api/action-timeline').then(r => r.json())]).then(([meta, data]) => {
  document.getElementById('source').textContent = `${meta.video_name} · ${meta.video.fps.toFixed(1)} fps · ${fmt(data.duration_s)}`;
  document.getElementById('notes').textContent = data.notes;
  document.getElementById('duration').textContent = fmt(data.duration_s);
  const banner = document.getElementById('banner');
  if (data.mode === 'dry_run') { banner.hidden = false; banner.textContent = 'DRY RUN — Frames decoded. No API call or action recognition has occurred.'; }
  if (data.task === 'visible_contact') {
    document.querySelector('h1').textContent = 'Body contact timeline';
    document.getElementById('timeline-title').textContent = 'Force-relevant contacts';
    document.querySelector('.meta').textContent = 'Body regions and contact timing';
    document.title = 'UHM · Body contact timeline';
  }
  const duration = Math.max(.001, data.duration_s);
  const rows = document.getElementById('rows');
  const playheads = [];
  for (const action of data.actions) {
    const row = document.createElement('div'); row.className = 'row';
    const name = document.createElement('span'); name.className = 'name'; name.textContent = action.replaceAll('_', ' ');
    const track = document.createElement('div'); track.className = 'track'; track.setAttribute('aria-label', `${action} track`);
    for (const window of data.windows) if (window.labels[action]?.state === 'unknown') {
      const unknown = document.createElement('span'); unknown.className = 'unknown';
      unknown.style.left = percent(window.start_s, duration); unknown.style.width = percent(window.end_s - window.start_s, duration);
      unknown.title = `${fmt(window.start_s)}–${fmt(window.end_s)}: ${window.status}`; track.appendChild(unknown);
    }
    for (const segment of data.segments.filter(s => s.label === action)) {
      const button = document.createElement('button'); button.className = 'segment'; button.type = 'button';
      button.style.left = percent(segment.start_s, duration); button.style.width = percent(segment.end_s - segment.start_s, duration);
      button.title = `${action}: ${fmt(segment.start_s)}–${fmt(segment.end_s)} · ${(segment.probability === null ? 'categorical label' : 'p=' + segment.probability.toFixed(2))}`;
      button.setAttribute('aria-label', `${action} from ${fmt(segment.start_s)} to ${fmt(segment.end_s)}`);
      button.addEventListener('click', () => { video.currentTime = segment.start_s; }); track.appendChild(button);
    }
    const head = document.createElement('span'); head.className = 'playhead'; track.appendChild(head); playheads.push(head);
    row.append(name, track); rows.appendChild(row);
  }
  video.addEventListener('timeupdate', () => { for (const head of playheads) head.style.left = percent(video.currentTime, duration); });
  const unresolved = data.windows.filter(w => w.status !== 'ok');
  document.getElementById('summary').textContent = `${data.segments.length} labeled intervals · ${unresolved.length} uncertain / error / not-run windows`;
  if (data.contact_events) {
    const contacts = document.createElement('div');
    for (const event of data.contact_events) {
      const button = document.createElement('button'); button.className = 'jump'; button.type = 'button';
      button.textContent = event.contact_region.replaceAll('_', ' ') + ' · ' + event.event_type.replaceAll('_', ' ') + ' · ' + fmt(event.start_s) + '–' + fmt(event.end_s);
      button.addEventListener('click', () => { video.currentTime = event.start_s; });
      contacts.appendChild(button);
    }
    document.getElementById('summary').after(contacts);
  }
  const details = document.getElementById('details');
  for (const window of data.windows) {
    const item = document.createElement('li'); const jump = document.createElement('button'); jump.className = 'jump'; jump.type = 'button';
    jump.textContent = `${fmt(window.start_s)}–${fmt(window.end_s)}`; jump.addEventListener('click', () => { video.currentTime = window.start_s; });
    item.append(jump, document.createTextNode(` · ${window.status}${window.error ? ': ' + window.error : ''}`)); details.appendChild(item);
  }
}).catch(error => { document.getElementById('notes').textContent = `Cannot load timeline: ${error}`; });
</script></body></html>
