[project]
name = "universal-haptic-model"
version = "0.1.0"
description = "Visual-only, participant-aware body force research baseline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "opencv-python-headless>=4.10,<5",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "typer>=0.15,<1",
  "psutil>=6,<8",
  "imageio-ffmpeg>=0.6,<1",
  "networkx>=3.2,<5",
]

[project.scripts]
uhm = "uhm.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uhm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
